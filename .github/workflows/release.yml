name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            ext: .exe
          - rid: linux-x64
            os: ubuntu-latest
            ext: ''
          - rid: osx-x64
            os: macos-latest
            ext: ''
          - rid: osx-arm64
            os: macos-latest
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME:-}"
          if [ -z "$tag" ]; then tag="v0.0.0-dev"; fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        # Husky's installer expects an `app/` directory at the ZIP root —
        # so we publish straight into `staging/app/` and zip the parent.
        # PublishReadyToRun=false keeps single-file artefacts a touch smaller;
        # boot is ~3-5% slower which is invisible for a long-running server.
        run: |
          dotnet publish src/Fishbowl.Host \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:PublishReadyToRun=false \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.ver.outputs.version }} \
            -o staging/app

      - name: Pack ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $rid = "${{ matrix.rid }}"
          $zipName = "Fishbowl-$version-$rid.zip"
          # Husky §6: ZIP root contains a single `app/` directory with the
          # published binaries. The user-data folder (`fishbowl-data/`) is
          # created next to the binary at first run and is preserved across
          # updates because Husky overlays new files without deleting.
          Compress-Archive -Path staging/app -DestinationPath $zipName
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: fishbowl-${{ matrix.rid }}
          path: ${{ env.ZIP_NAME }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
