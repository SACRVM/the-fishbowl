<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Fishbowl</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <!-- lib (load order matters: globals → icons → router+context+api, then components, then views) -->
    <script defer src="/js/lib/globals.js"></script>
    <script defer src="/js/lib/icons.js"></script>
    <script defer src="/js/lib/router.js"></script>
    <script defer src="/js/lib/context.js"></script>
    <script defer src="/js/lib/vault.js"></script>
    <script defer src="/js/lib/api.js"></script>
    <script defer src="/js/lib/tags-registry.js"></script>
    <script defer src="/js/lib/dialog.js"></script>

    <!-- vendor (CommonMark + GFM parser and HTML sanitiser — must load before fb-md-editor.js) -->
    <script defer src="/js/vendor/marked.min.js"></script>
    <script defer src="/js/vendor/purify.min.js"></script>

    <!-- components -->
    <script defer src="/js/components/fb-icon.js"></script>
    <script defer src="/js/components/fb-footer.js"></script>
    <script defer src="/js/components/fb-nav.js"></script>
    <script defer src="/js/components/fb-section.js"></script>
    <script defer src="/js/components/fb-toggle.js"></script>
    <script defer src="/js/components/fb-segmented-control.js"></script>
    <script defer src="/js/components/fb-window.js"></script>
    <script defer src="/js/components/fb-dialog.js"></script>
    <script defer src="/js/components/fb-status-banner.js"></script>
    <script defer src="/js/components/fb-slider.js"></script>
    <script defer src="/js/components/fb-hud.js"></script>
    <script defer src="/js/components/fb-log.js"></script>
    <script defer src="/js/components/fb-terminal.js"></script>
    <script defer src="/js/components/fb-loader.js"></script>
    <script defer src="/js/components/fb-collapsible.js"></script>
    <script defer src="/js/components/fb-tag-chip.js"></script>
    <script defer src="/js/components/fb-tag-input.js"></script>
    <script defer src="/js/components/fb-tag-manage-dialog.js"></script>
    <script defer src="/js/components/fb-context-switcher.js"></script>
    <script defer src="/js/components/fb-md-editor.js"></script>

    <!-- views -->
    <script defer src="/js/views/fb-hub-view.js"></script>
    <script defer src="/js/views/fb-notes-view.js"></script>
    <script defer src="/js/views/fb-todos-view.js"></script>
    <script defer src="/js/views/fb-spaces-settings-view.js"></script>
    <script defer src="/js/views/fb-keys-settings-view.js"></script>

    <!-- shell -->
    <fb-nav>
        <fb-context-switcher slot="context"></fb-context-switcher>
    </fb-nav>
    <div id="app-root"></div>

    <script defer>
        window.addEventListener("DOMContentLoaded", () => {
            // Router mounts views into #app-root. Views register themselves
            // at script load time (defer preserves the script order above).
            if (fb.router) fb.router.mount("#app-root");
        });
    </script>
</body>
</html>
