<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover: the kit pads the nav and scroll regions by the
         safe-area insets, so nothing ends up behind a notch or home bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f1a">
    <title>The Fishbowl</title>
    <!-- app.css first: Fishbowl's own tokens (tag palette, vault) and the
         legacy view styles. The vendored kit's ui.css loads after it and wins
         wherever both define the same rule. -->
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/kit/css/ui.css">
</head>
<body>
    <!-- lib (load order matters: fb globals → kit lib → fb lib, then
         components, then views) -->
    <script defer src="/js/lib/globals.js"></script>
    <script defer src="/kit/js/lib/globals.js"></script>
    <script defer src="/kit/js/lib/icons.js"></script>
    <script defer src="/kit/js/lib/router.js"></script>
    <script defer src="/kit/js/lib/scope.js"></script>
    <script defer src="/kit/js/lib/dialog.js"></script>
    <script defer src="/kit/js/lib/sortable.js"></script>
    <script defer src="/kit/js/lib/hotkeys.js"></script>
    <script defer src="/kit/js/lib/pan-zoom.js"></script>
    <script defer src="/kit/js/lib/fs.js"></script>
    <script defer src="/js/lib/kit-config.js"></script>
    <script defer src="/js/lib/vault.js"></script>
    <script defer src="/js/lib/api.js"></script>
    <script defer src="/js/lib/format.js"></script>
    <script defer src="/js/lib/files-store.js"></script>
    <script defer src="/js/lib/accounts.js"></script>
    <script defer src="/js/lib/desktop.js"></script>
    <script defer src="/js/lib/tags-registry.js"></script>
    <script defer src="/js/lib/tag-manager.js"></script>

    <!-- vendor (CommonMark + GFM parser and HTML sanitiser — ships with the kit,
         must load before sac-md-editor.js) -->
    <script defer src="/kit/js/vendor/marked.min.js"></script>
    <script defer src="/kit/js/vendor/purify.min.js"></script>

    <!-- kit components -->
    <script defer src="/kit/js/components/sac-icon.js"></script>
    <script defer src="/kit/js/components/sac-nav.js"></script>
    <script defer src="/kit/js/components/sac-menu.js"></script>
    <script defer src="/kit/js/components/sac-split.js"></script>
    <script defer src="/kit/js/components/sac-dialog.js"></script>
    <script defer src="/kit/js/components/sac-copy-button.js"></script>
    <script defer src="/kit/js/components/sac-swatch-grid.js"></script>
    <script defer src="/kit/js/components/sac-calendar.js"></script>
    <script defer src="/kit/js/components/sac-date-field.js"></script>
    <script defer src="/kit/js/components/sac-time-field.js"></script>
    <script defer src="/kit/js/components/sac-window.js"></script>
    <script defer src="/kit/js/components/sac-avatar.js"></script>
    <script defer src="/kit/js/components/sac-footer.js"></script>
    <script defer src="/kit/js/components/sac-chip-input.js"></script>
    <script defer src="/kit/js/components/sac-chip.js"></script>
    <script defer src="/kit/js/components/sac-collapsible.js"></script>
    <script defer src="/kit/js/components/sac-status-banner.js"></script>
    <script defer src="/kit/js/components/sac-toast.js"></script>
    <script defer src="/kit/js/components/sac-progress.js"></script>
    <script defer src="/kit/js/components/sac-drop-zone.js"></script>
    <script defer src="/kit/js/components/sac-file-browser.js"></script>
    <script defer src="/kit/js/components/sac-quick-look.js"></script>
    <script defer src="/kit/js/components/sac-tabs.js"></script>
    <script defer src="/kit/js/components/sac-shortcut-sheet.js"></script>
    <script defer src="/kit/js/components/sac-shortcut-bar.js"></script>
    <script defer src="/kit/js/components/sac-command-palette.js"></script>

    <!-- sac-md-editor: appkit add-on module, vendored verbatim from
         SACRVM/sac-md-editor (pinned commit in the VERSION file next to it).
         Never edit in place — fixes go upstream, updates replace the file. -->
    <script defer src="/js/vendor/sac-md-editor/sac-md-editor.js"></script>

    <!-- views -->
    <script defer src="/js/views/fb-hub-view.js"></script>
    <script defer src="/js/views/fb-notes-view.js"></script>
    <script defer src="/js/views/fb-todos-view.js"></script>
    <script defer src="/js/views/fb-calendar-view.js"></script>
    <script defer src="/js/views/fb-files-view.js"></script>
    <script defer src="/js/views/fb-spaces-settings-view.js"></script>
    <script defer src="/js/views/fb-keys-settings-view.js"></script>
    <script defer src="/js/views/fb-secrets-settings-view.js"></script>
    <script defer src="/js/views/fb-messages-view.js"></script>
    <script defer src="/js/views/fb-users-admin-view.js"></script>

    <!-- shell: account menu, view toolbar, router mount -->
    <script defer src="/js/lib/shell.js"></script>

    <sac-nav id="fb-nav" brand="THE FISHBOWL" brand-icon="fish">
        <sac-menu slot="context" id="fb-context">
            <button slot="trigger" class="fb-context-pill" aria-label="Switch workspace">
                <sac-icon name="user"></sac-icon>
                <span class="fb-context-label">Personal</span>
                <sac-icon class="fb-context-caret" name="chevron-down"></sac-icon>
            </button>
        </sac-menu>
        <!-- fb.toolbar renders the active view's actions here. -->
        <div slot="toolbar" class="toolbar" id="fb-view-toolbar"></div>
        <!-- The Ctrl/⌘K palette, made visible (a phone has no Ctrl-K).
             Outside fb.toolbar, so per-view repaints never drop it. -->
        <button slot="toolbar" class="nav-icon-btn" id="fb-search-btn"
                aria-label="Search and commands" title="Search and commands">
            <sac-icon name="search"></sac-icon>
        </button>
        <!-- System messages: the envelope + unread count, shown once /me
             loaded. Outside fb.toolbar, so per-view repaints never drop it. -->
        <button slot="toolbar" class="nav-icon-btn has-badge" id="fb-messages-btn"
                aria-label="Messages" title="Messages" hidden>
            <sac-icon name="mail"></sac-icon>
        </button>
        <!-- Account menu. When the ribbon runs out of room (a phone), the kit
             folds it into the "…" menu as a group; sac:select still fires here. -->
        <sac-menu slot="toolbar" id="fb-account" hidden>
            <button slot="trigger" class="nav-icon-btn avatar"
                    aria-label="Account" title="Account">
                <sac-avatar id="fb-account-avatar"></sac-avatar>
            </button>
            <button data-action="profile"><sac-icon name="user"></sac-icon> Profile</button>
            <hr>
            <button data-action="logout" data-danger><sac-icon name="log-out"></sac-icon> Log out</button>
        </sac-menu>
    </sac-nav>
    <div id="app-root"></div>
    <sac-command-palette></sac-command-palette>
</body>
</html>
