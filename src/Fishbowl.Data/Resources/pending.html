<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting for approval · The Fishbowl</title>
    <link rel="icon" type="image/svg+xml" href="/img/fishbowl.svg">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/kit/css/ui.css">
    <script src="/js/lib/theme.js"></script>
</head>
<body>
    <div class="orb"></div>

    <!-- The one page a pending account can reach (AccountStateMiddleware).
         Server-rendered like /login: no SPA, no API beyond /api/v1/me. -->
    <div class="center-shell">
        <div class="center-card">
            <h1>THE FISHBOWL</h1>
            <p class="tagline" data-t="waiting">Your account is waiting for approval.</p>
            <p class="auth-note" id="pending-who"></p>
            <p class="auth-note" data-t="told">An admin of this Fishbowl has been told. You'll get access as soon as they approve it — sign in again then, or just reload this page.</p>
            <div class="auth-actions">
                <button type="button" class="btn primary" id="pending-check" data-t="check">Check again</button>
                <a class="btn" href="/logout" data-t="sign-out">Sign out</a>
            </div>
        </div>
    </div>
    <script src="/js/pages/pending.js"></script>
</body>
</html>
