<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · The Fishbowl</title>
    <link rel="icon" type="image/svg+xml" href="/img/fishbowl.svg">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/kit/css/ui.css">
    <script src="/js/lib/theme.js"></script>
</head>
<body>
    <div class="orb"></div>

    <div class="center-shell">
        <div class="center-card">
            <img class="fb-fishbowl" src="/img/fishbowl.svg" alt="">
            <h1>THE FISHBOWL</h1>
            <p class="tagline" data-t="tagline">Your memory lives here. You don't.</p>

            <div class="providers" id="providers">
                <!-- Populated by JS -->
            </div>
            <form id="local-form" class="local-login" style="display:none;">
                <div class="form-group">
                    <label for="local-username" data-t="username">Username</label>
                    <input type="text" id="local-username" name="username"
                           autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="local-password" data-t="password">Password</label>
                    <input type="password" id="local-password" name="password"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn primary" data-t="sign-in">Sign in</button>
            </form>

            <form id="change-form" class="local-login" style="display:none;">
                <p class="tagline" data-t="reset-intro">An administrator reset your password. Pick a new one to continue.</p>
                <div class="form-group">
                    <label for="change-username" data-t="username">Username</label>
                    <input type="text" id="change-username" name="username"
                           autocomplete="username" readonly>
                </div>
                <div class="form-group">
                    <label for="change-current" data-t="temp-password">Temporary password</label>
                    <input type="password" id="change-current" name="currentPassword"
                           autocomplete="current-password" required>
                </div>
                <div class="form-group">
                    <label for="change-new" data-t="new-password">New password</label>
                    <input type="password" id="change-new" name="newPassword"
                           autocomplete="new-password" placeholder="at least 12 characters" data-t-placeholder="min-length" required>
                </div>
                <button type="submit" class="btn primary" data-t="save-sign-in">Save and sign in</button>
            </form>
            <p id="error" class="error" style="display:none;"></p>
        </div>
    </div>

    <script src="/js/pages/login.js"></script>
</body>
</html>
