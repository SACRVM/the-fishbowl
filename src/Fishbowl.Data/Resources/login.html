<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · The Fishbowl</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div class="orb"></div>

    <div class="auth-shell">
        <div class="auth-card">
            <svg class="fb-fishbowl" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <defs>
                    <radialGradient id="fb-water" cx="50%" cy="35%" r="70%">
                        <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.62"/>
                        <stop offset="100%" stop-color="#1e40af" stop-opacity="0.92"/>
                    </radialGradient>
                    <radialGradient id="fb-glass" cx="35%" cy="28%" r="85%">
                        <stop offset="0%"   stop-color="rgba(255,255,255,0.32)"/>
                        <stop offset="55%"  stop-color="rgba(255,255,255,0.04)"/>
                        <stop offset="100%" stop-color="rgba(255,255,255,0.10)"/>
                    </radialGradient>
                    <!-- Bowl interior: rounded body with narrow opening on top -->
                    <clipPath id="fb-bowl-inside">
                        <path d="M50 26 Q50 22 60 22 Q70 22 70 26 L70 30
                                 Q90 36 102 54 Q110 70 102 90 Q90 110 60 110
                                 Q30 110 18 90 Q10 70 18 54 Q30 36 50 30 Z"/>
                    </clipPath>
                </defs>

                <!-- Inside the bowl: water + wave + goldfish + bubbles -->
                <g clip-path="url(#fb-bowl-inside)">
                    <rect x="0" y="40" width="120" height="80" fill="url(#fb-water)"/>
                    <path d="M0 40 Q15 36 30 40 T60 40 T90 40 T120 40 V46 H0 Z"
                          fill="rgba(255,255,255,0.28)"/>
                    <g transform="translate(48 72)">
                        <ellipse cx="0" cy="0" rx="16" ry="9" fill="#f97316"/>
                        <path d="M16 0 L26 -10 L26 10 Z" fill="#f97316"/>
                        <path d="M-2 6 Q3 14 9 8 Z" fill="#fb923c"/>
                        <circle cx="-7" cy="-2" r="1.6" fill="#0a0a0a"/>
                        <ellipse cx="-4" cy="-5" rx="3.5" ry="1.2" fill="rgba(255,255,255,0.5)"/>
                    </g>
                    <circle cx="86" cy="62" r="2.5" fill="rgba(255,255,255,0.6)"/>
                    <circle cx="92" cy="54" r="1.8" fill="rgba(255,255,255,0.5)"/>
                    <circle cx="84" cy="48" r="1.2" fill="rgba(255,255,255,0.45)"/>
                </g>

                <!-- Glass body -->
                <path d="M50 26 Q50 22 60 22 Q70 22 70 26 L70 30
                         Q90 36 102 54 Q110 70 102 90 Q90 110 60 110
                         Q30 110 18 90 Q10 70 18 54 Q30 36 50 30 Z"
                      fill="url(#fb-glass)" stroke="rgba(255,255,255,0.55)"
                      stroke-width="1.6" stroke-linejoin="round"/>

                <!-- Rim ellipse (opening) -->
                <ellipse cx="60" cy="24" rx="10" ry="2.5"
                         fill="rgba(0,0,0,0.35)"
                         stroke="rgba(255,255,255,0.65)" stroke-width="1.4"/>

                <!-- Glass highlight on the upper-left curve -->
                <path d="M25 56 Q28 38 44 32"
                      fill="none" stroke="rgba(255,255,255,0.45)"
                      stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <h1>THE FISHBOWL</h1>
            <p class="tagline">Your memory lives here. You don't.</p>

            <div class="providers" id="providers">
                <!-- Populated by JS -->
            </div>
            <form id="local-form" class="local-login" style="display:none; margin-top: 1rem;">
                <div class="form-group">
                    <label for="local-username">Username</label>
                    <input type="text" id="local-username" name="username"
                           autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="local-password">Password</label>
                    <input type="password" id="local-password" name="password"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn primary" style="width:100%;">
                    Sign in
                </button>
            </form>

            <form id="change-form" class="local-login" style="display:none; margin-top: 1rem;">
                <p class="tagline">An administrator reset your password. Pick a new one to continue.</p>
                <div class="form-group">
                    <label for="change-username">Username</label>
                    <input type="text" id="change-username" name="username"
                           autocomplete="username" readonly>
                </div>
                <div class="form-group">
                    <label for="change-current">Temporary password</label>
                    <input type="password" id="change-current" name="currentPassword"
                           autocomplete="current-password" required>
                </div>
                <div class="form-group">
                    <label for="change-new">New password</label>
                    <input type="password" id="change-new" name="newPassword"
                           autocomplete="new-password" placeholder="at least 12 characters" required>
                </div>
                <button type="submit" class="btn primary" style="width:100%;">
                    Save and sign in
                </button>
            </form>
            <p id="error" class="error" style="display:none;"></p>
        </div>
    </div>

    <script>
    (async function () {
        const providersEl = document.getElementById("providers");
        const localForm = document.getElementById("local-form");
        const changeForm = document.getElementById("change-form");
        const errorEl = document.getElementById("error");

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.style.display = "block";
        }

        function clearError() { errorEl.style.display = "none"; }

        // Swap the visible form. Carries the username forward and pre-fills the
        // "temporary password" field with whatever the user just typed (saves
        // them re-entering on the next screen).
        function showChangeForm(username, currentPassword) {
            localForm.style.display = "none";
            providersEl.style.display = "none";
            changeForm.style.display = "block";
            document.getElementById("change-username").value = username;
            document.getElementById("change-current").value = currentPassword || "";
            document.getElementById("change-new").focus();
        }

        try {
            const res = await fetch("/api/auth/providers");
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const providers = await res.json();

            if (!providers || providers.length === 0) {
                // Unconfigured — go to setup
                window.location.href = "/setup";
                return;
            }

            // OAuth providers (everything except local) get a button each.
            const oauthProviders = providers.filter(p => p.id !== "local");
            providersEl.innerHTML = oauthProviders.map(p => `
                <a class="provider-btn" href="/login/challenge/${p.id}">
                    <span>Continue with ${p.name}</span>
                </a>
            `).join("");

            // Local form is its own block — username + password don't fit the
            // "click a provider button" shape.
            const hasLocal = providers.some(p => p.id === "local");
            if (hasLocal) {
                localForm.style.display = "block";
            }
        } catch (err) {
            showError("Unable to load providers: " + err.message);
        }

        localForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            clearError();

            const username = document.getElementById("local-username").value.trim();
            const password = document.getElementById("local-password").value;

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                if (res.status === 204) {
                    window.location.href = "/";
                    return;
                }
                if (res.status === 200) {
                    // Must-change branch — the temp password was correct but
                    // the server refused to issue a cookie. Move them to the
                    // change-password form.
                    const body = await res.json().catch(() => ({}));
                    if (body?.mustChangePassword) {
                        showChangeForm(body.username || username, password);
                        return;
                    }
                }
                if (res.status === 401) {
                    showError("Wrong username or password.");
                    return;
                }
                const text = await res.text().catch(() => "");
                showError("Sign-in failed: " + (text || res.status));
            } catch (err) {
                showError("Request failed: " + err.message);
            }
        });

        changeForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            clearError();

            const username = document.getElementById("change-username").value.trim();
            const currentPassword = document.getElementById("change-current").value;
            const newPassword = document.getElementById("change-new").value;

            if (newPassword.length < 12) {
                showError("New password must be at least 12 characters.");
                return;
            }
            if (newPassword === currentPassword) {
                showError("New password must differ from the temporary one.");
                return;
            }

            try {
                const res = await fetch("/api/auth/change-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, currentPassword, newPassword })
                });
                if (res.status === 204) {
                    window.location.href = "/";
                    return;
                }
                if (res.status === 401) {
                    showError("Temporary password didn't match. Ask the admin for a fresh reset.");
                    return;
                }
                const text = await res.text().catch(() => "");
                showError("Couldn't change password: " + (text || res.status));
            } catch (err) {
                showError("Request failed: " + err.message);
            }
        });
    })();
    </script>
</body>
</html>
